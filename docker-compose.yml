services:
  postgres:
    image: postgres:15-alpine
    container_name: whats-the-tab-postgres
    environment:
      POSTGRES_DB: whatsthetab
      POSTGRES_USER: whatsthetab
      POSTGRES_PASSWORD: whatsthetab
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsthetab"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: whats-the-tab-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: whats-the-tab-web
    ports:
      - "8008:8008"
    environment:
      DEBUG: "False"
      SERVE_MEDIA: "${SERVE_MEDIA:-True}"
      SECRET_KEY: "${SECRET_KEY:-dev-key-change-in-production}"
      WORKER_SHARED_SECRET: "${WORKER_SHARED_SECRET:-dev-worker-secret-change-in-production}"
      AWS_STORAGE_BUCKET_NAME: "${AWS_STORAGE_BUCKET_NAME:-}"
      AWS_S3_ENDPOINT_URL: "${AWS_S3_ENDPOINT_URL:-}"
      AWS_S3_REGION_NAME: "${AWS_S3_REGION_NAME:-auto}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_S3_ADDRESSING_STYLE: "${AWS_S3_ADDRESSING_STYLE:-virtual}"
      AWS_QUERYSTRING_EXPIRE: "${AWS_QUERYSTRING_EXPIRE:-3600}"
      AWS_REQUEST_CHECKSUM_CALCULATION: "${AWS_REQUEST_CHECKSUM_CALCULATION:-when_supported}"
      AWS_RESPONSE_CHECKSUM_VALIDATION: "${AWS_RESPONSE_CHECKSUM_VALIDATION:-when_supported}"
      DATABASE_URL: "postgres://whatsthetab:whatsthetab@postgres:5432/whatsthetab"
      REDIS_URL: "redis://redis:6379"
      WEB_URL: "http://web:8008"
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whats-the-tab-worker
    environment:
      DEBUG: "False"
      SECRET_KEY: "dev-key-change-in-production"
      WORKER_SHARED_SECRET: "${WORKER_SHARED_SECRET:-dev-worker-secret-change-in-production}"
      REDIS_URL: "redis://redis:6379"
      WEB_URL: "http://web:8008"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres_data:
  media_data:
