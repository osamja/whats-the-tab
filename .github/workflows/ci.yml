name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: osamja/whats-the-tab-web

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: whatsthetab
          POSTGRES_USER: whatsthetab
          POSTGRES_PASSWORD: whatsthetab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Run migrations
        env:
          DEBUG: 'False'
          SECRET_KEY: ci-test-key
          DATABASE_URL: postgres://whatsthetab:whatsthetab@localhost:5432/whatsthetab
          REDIS_URL: redis://localhost:6379
        run: uv run python manage.py migrate --noinput

      - name: Run tests
        env:
          DEBUG: 'False'
          SECRET_KEY: ci-test-key
          DATABASE_URL: postgres://whatsthetab:whatsthetab@localhost:5432/whatsthetab
          REDIS_URL: redis://localhost:6379
        run: uv run python manage.py test accounts

  build-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  health-check:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Verify API health
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://pyaar.ai/transcribe/)
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed: HTTP $STATUS"
            exit 1
          fi
          echo "Health check passed: HTTP $STATUS"

      - name: Verify metrics endpoint
        run: |
          METRICS=$(curl -sf https://pyaar.ai/transcribe/metrics/)
          echo "$METRICS" | python -m json.tool
