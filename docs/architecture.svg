<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <style>
    text { font-family: Inter, "DejaVu Sans", sans-serif; }
    .title { font-size: 34px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 17px; fill: #475569; }
    .panel-title { font-size: 18px; font-weight: 700; fill: #0f172a; }
    .panel-subtitle { font-size: 13px; fill: #64748b; }
    .card-title { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .card-body { font-size: 13px; fill: #475569; }
    .card-small { font-size: 12px; fill: #64748b; }
    .edge-label { font-size: 12px; fill: #475569; paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; stroke-linejoin: round; }
    .legend { font-size: 13px; fill: #334155; }
    .note { font-size: 13px; fill: #64748b; }
  </style>

  <rect width="1600" height="1120" fill="#f8fafc"/>

  <text x="60" y="64" class="title">whats-the-tab — target architecture</text>
  <text x="60" y="98" class="subtitle">Django + Redis + Postgres on an always-on host; Vast.ai Serverless for GPU inference</text>

  <!-- Client -->
  <rect x="60" y="140" width="260" height="110" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="190" y="175" text-anchor="middle" class="card-title">Browser / web app</text>
  <text x="190" y="201" text-anchor="middle" class="card-body">upload · generate</text>
  <text x="190" y="221" text-anchor="middle" class="card-body">poll status · download MIDI</text>

  <!-- Edge -->
  <rect x="400" y="140" width="260" height="110" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="530" y="175" text-anchor="middle" class="card-title">Edge</text>
  <text x="530" y="201" text-anchor="middle" class="card-body">Cloudflare DNS + TLS</text>
  <text x="530" y="221" text-anchor="middle" class="card-body">nginx reverse proxy</text>

  <line x1="320" y1="195" x2="392" y2="195" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="356" y="185" text-anchor="middle" class="edge-label">HTTPS</text>

  <path d="M530 250 V310 H390 V400" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="462" y="302" text-anchor="middle" class="edge-label">HTTPS</text>

  <!-- Linode panel -->
  <rect x="60" y="330" width="840" height="500" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="84" y="364" class="panel-title">Linode — always-on web tier</text>
  <text x="84" y="386" class="panel-subtitle">Django, subscriber, queue, and job state</text>

  <!-- Django -->
  <rect x="90" y="400" width="340" height="170" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="260" y="432" text-anchor="middle" class="card-title">Django web (gunicorn)</text>
  <text x="260" y="458" text-anchor="middle" class="card-body">/upload · /generate</text>
  <text x="260" y="478" text-anchor="middle" class="card-body">/status · /midi</text>
  <text x="260" y="498" text-anchor="middle" class="card-body">subscriber (Redis → DB)</text>
  <text x="260" y="518" text-anchor="middle" class="card-small">API key · rate limits · readiness</text>
  <text x="260" y="542" text-anchor="middle" class="card-small">MIDI via presigned redirect</text>

  <!-- Postgres -->
  <rect x="480" y="400" width="170" height="120" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="565" y="432" text-anchor="middle" class="card-title">PostgreSQL</text>
  <text x="565" y="458" text-anchor="middle" class="card-body">jobs · status</text>
  <text x="565" y="478" text-anchor="middle" class="card-body">chunks · errors</text>

  <!-- Redis -->
  <rect x="700" y="400" width="170" height="120" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="785" y="432" text-anchor="middle" class="card-title">Redis</text>
  <text x="785" y="458" text-anchor="middle" class="card-body">queue</text>
  <text x="785" y="478" text-anchor="middle" class="card-body">pub/sub progress</text>

  <!-- Dispatcher -->
  <rect x="400" y="580" width="360" height="150" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="580" y="612" text-anchor="middle" class="card-title">Dispatcher (runworker)</text>
  <text x="580" y="638" text-anchor="middle" class="card-body">claims task from Redis</text>
  <text x="580" y="658" text-anchor="middle" class="card-body">calls Vast inference endpoint</text>
  <text x="580" y="678" text-anchor="middle" class="card-body">POST /_result with worker token</text>
  <text x="580" y="702" text-anchor="middle" class="card-small">keeps queue / retry / progress semantics</text>

  <!-- Django -> Postgres -->
  <line x1="430" y1="450" x2="472" y2="450" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <text x="451" y="441" text-anchor="middle" class="edge-label">job state</text>

  <!-- Django <-> Redis -->
  <path d="M430 415 H785 V392" fill="none" stroke="#d97706" stroke-width="2.2" stroke-dasharray="7 5" marker-start="url(#arrow-amber)" marker-end="url(#arrow-amber)"/>
  <text x="610" y="382" text-anchor="middle" class="edge-label">enqueue · progress events</text>

  <!-- Redis -> Dispatcher -->
  <path d="M785 520 V550 H700 V572" fill="none" stroke="#d97706" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow-amber)"/>
  <text x="742" y="545" text-anchor="middle" class="edge-label">claim task</text>

  <!-- Dispatcher -> Django -->
  <path d="M400 610 H340 V572" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="355" y="598" text-anchor="middle" class="edge-label">POST /_result</text>

  <!-- Django -> R2 -->
  <path d="M260 400 V285 H970 V375 H1000" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="2 5" marker-end="url(#arrow-green)"/>
  <text x="620" y="275" text-anchor="middle" class="edge-label">audio upload · presigned URLs</text>

  <!-- R2 -->
  <rect x="1000" y="330" width="540" height="150" rx="16" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="1270" y="365" text-anchor="middle" class="card-title">Cloudflare R2 / S3</text>
  <text x="1270" y="393" text-anchor="middle" class="card-body">audio/ · midi/</text>
  <text x="1270" y="413" text-anchor="middle" class="card-body">presigned GET / PUT</text>
  <text x="1270" y="433" text-anchor="middle" class="card-small">lifecycle + retention cleanup</text>

  <!-- Vast panel -->
  <rect x="940" y="520" width="620" height="420" rx="20" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
  <text x="964" y="554" class="panel-title">Vast.ai Serverless — GPU inference only</text>
  <text x="964" y="576" class="panel-subtitle">request-scoped, autoscaled, ephemeral workers</text>

  <!-- Vast endpoint -->
  <rect x="970" y="590" width="560" height="100" rx="14" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
  <text x="1250" y="622" text-anchor="middle" class="card-title">Vast Deployments endpoint</text>
  <text x="1250" y="648" text-anchor="middle" class="card-body">route · signed auth · autoscaling</text>
  <text x="1250" y="668" text-anchor="middle" class="card-small">cold_workers / max_workers / queue time</text>

  <!-- GPU worker -->
  <rect x="970" y="730" width="560" height="160" rx="14" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="1250" y="762" text-anchor="middle" class="card-title">GPU worker (RTX 4090 / A10 / L4)</text>
  <text x="1250" y="790" text-anchor="middle" class="card-body">model loaded once</text>
  <text x="1250" y="810" text-anchor="middle" class="card-body">MT3 + incremental K/V cache</text>
  <text x="1250" y="830" text-anchor="middle" class="card-body">ephemeral disk · no DB access</text>
  <text x="1250" y="852" text-anchor="middle" class="card-small">downloads audio via presigned URL</text>

  <!-- Endpoint -> GPU -->
  <line x1="1250" y1="690" x2="1250" y2="722" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrow-purple)"/>
  <text x="1262" y="712" class="edge-label">route</text>

  <!-- Dispatcher -> Vast -->
  <line x1="760" y1="648" x2="962" y2="648" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="861" y="638" text-anchor="middle" class="edge-label">POST /remote/transcribe</text>

  <!-- Vast -> Dispatcher -->
  <line x1="970" y1="670" x2="768" y2="670" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrow-purple)"/>
  <text x="869" y="688" text-anchor="middle" class="edge-label">MIDI bytes</text>

  <!-- GPU -> R2 -->
  <path d="M970 780 H920 V405 H992" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="2 5" marker-end="url(#arrow-green)"/>
  <text x="960" y="395" text-anchor="middle" class="edge-label">GET audio</text>

  <!-- Legend -->
  <rect x="60" y="980" width="1480" height="76" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="88" y1="1012" x2="136" y2="1012" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="146" y="1017" class="legend">HTTPS / API</text>

  <line x1="286" y1="1012" x2="334" y2="1012" stroke="#d97706" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow-amber)"/>
  <text x="344" y="1017" class="legend">Redis queue / events</text>

  <line x1="540" y1="1012" x2="588" y2="1012" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="2 5" marker-end="url(#arrow-green)"/>
  <text x="598" y="1017" class="legend">Object storage</text>

  <line x1="780" y1="1012" x2="828" y2="1012" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="838" y="1017" class="legend">Vast inference</text>

  <line x1="1000" y1="1012" x2="1048" y2="1012" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow-slate)"/>
  <text x="1058" y="1017" class="legend">Internal state / callback</text>

  <text x="60" y="1084" class="note">Local dev / self-hosted mode: replace the Vast panel with runworker on the GPU host. Django, Redis, Postgres, and R2 stay the same.</text>
</svg>
